name: Generate PDFs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-pictures

      - name: Install fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer
          sudo fc-cache -f

      - name: Compile all PDFs
        run: |
          find . -name "entry.tex" -not -path "./.git/*" -not -path "./templates/*" \
            | sort | while read tex; do
              dir="${tex%/entry.tex}"
              bash compile.sh "${dir#./}/entry.tex"
            done

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: contest-pdfs
          path: "**/entry.pdf"
